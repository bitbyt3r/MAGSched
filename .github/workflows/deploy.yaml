name: test and deploy
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest
  deploy:
    name: deploy lambda functions
    environment: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build shared package
        run: |
          pip install --target package -r requirements.txt
          cp *.py package/
          cp -r templates static package/
          cd package
          zip -r ../lambda.zip .
      - name: Deploy frontend lambda
        uses: appleboy/lambda-action@v0.2.0
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: ${{ secrets.AWS_REGION }}
          function_name: magsched_guidebook_frontend
          zip_file: lambda.zip
          memory_size: 256
          timeout: 20
          handler: frontend.lambda_handler
          runtime: python3.13
      - name: Deploy loader lambda
        uses: appleboy/lambda-action@v0.2.0
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: ${{ secrets.AWS_REGION }}
          function_name: magsched_guidebook_loader
          zip_file: lambda.zip
          memory_size: 128
          timeout: 120
          handler: loader.lambda_handler
          runtime: python3.13
